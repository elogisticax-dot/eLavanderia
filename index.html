<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eLavanderia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Painel em blocos, mono, cartões arredondados, cor só para estado. Referência escolhida pelo usuário. */
:root {
  --bg: #F7F7F8; --surface: #FFFFFF; --sunken: #F4F4F5; --ink: #18181B; --muted: #71717A; --faint: #A1A1AA;
  --line: #E7E7EA; --line-strong: #D4D4D8; --campo: #8E8E96;
  --accent: #2563EB; --accent-ink: #FFFFFF; --accent-soft: #EAF1FF; --link: #2563EB;
  --ok: #047857; --ok-soft: #DCFCE7; --ok-dot: #10B981;
  --bad: #BE123C; --bad-soft: #FFE4E6; --bad-dot: #F43F5E;
  --warn: #B45309; --warn-soft: #FEF3C7; --warn-dot: #F59E0B;
  --info: #1D4ED8; --info-soft: #DBEAFE;
  --roxo: #6D28D9; --roxo-soft: #EDE9FE;
  --neutro: #52525B; --neutro-soft: #F4F4F5;
  --h1: #DBEAFE; --h2: #BFDBFE; --h3: #93C5FD; --h4: #3B82F6; --h0: #F1F1F3;
  --serie-a: #D4D4D8; --serie-b: #3B82F6;
  --mop-red: #E11D48;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px; --r-s: 10px;
  color-scheme: light;
}
:root[data-modo="escuro"] {
  --bg: #0B0B0D; --surface: #141417; --sunken: #1C1C20; --ink: #FAFAFA; --muted: #A1A1AA; --faint: #71717A;
  --line: #26262B; --line-strong: #3A3A41; --campo: #5E5E66;
  --accent: #3B82F6; --accent-ink: #FFFFFF; --accent-soft: #172554; --link: #93C5FD;
  --ok: #34D399; --ok-soft: rgba(16, 185, 129, .16); --ok-dot: #10B981;
  --bad: #FB7185; --bad-soft: rgba(244, 63, 94, .16); --bad-dot: #F43F5E;
  --warn: #FBBF24; --warn-soft: rgba(245, 158, 11, .16); --warn-dot: #F59E0B;
  --info: #93C5FD; --info-soft: rgba(59, 130, 246, .18);
  --roxo: #C4B5FD; --roxo-soft: rgba(139, 92, 246, .2);
  --neutro: #A1A1AA; --neutro-soft: #232328;
  --h1: #172554; --h2: #1E3A8A; --h3: #1D4ED8; --h4: #60A5FA; --h0: #1C1C20;
  --serie-a: #3A3A41; --serie-b: #3B82F6;
  --mop-red: #FB7185;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--ink); font: 14px/1.55 var(--mono); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; font-weight: 500; text-wrap: balance; }
h1 { font-size: 22px; letter-spacing: -0.02em; }
h2 { font-size: 14px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg { flex: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- casca: menu lateral recolhível ---------- */
.casca { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; transition: grid-template-columns .18s ease; }
.casca.recolhido { grid-template-columns: 72px minmax(0, 1fr); }
.lateral-nav { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; background: var(--surface); border-right: 1px solid var(--line); overflow: hidden; }
.marca { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; font-weight: 600; white-space: nowrap; }
.logo { width: 32px; height: 32px; border-radius: 9px; background: var(--ink); color: var(--surface); display: grid; place-items: center; flex: none; }
.logo svg { width: 18px; height: 18px; }
.marca-txt { display: flex; flex-direction: column; line-height: 1.2; }
.marca-txt small { font-weight: 400; color: var(--muted); font-size: 11px; }
.nav-lista { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
.aba { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: var(--r-s); color: var(--muted); text-decoration: none; font-size: 13px; white-space: nowrap; }
.aba svg { width: 18px; height: 18px; }
.aba:hover { background: var(--sunken); color: var(--ink); }
.aba[aria-current="page"] { background: var(--sunken); color: var(--ink); font-weight: 500; }
.aba.primaria { background: var(--accent); color: var(--accent-ink); font-weight: 500; margin-bottom: 6px; }
.aba.primaria:hover, .aba.primaria[aria-current="page"] { background: var(--accent); color: var(--accent-ink); filter: brightness(1.06); }
.nav-rodape { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--line); padding-top: 10px; }
.nav-btn { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: var(--r-s); border: 0; background: none; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; text-align: left; }
.nav-btn:hover { background: var(--sunken); color: var(--ink); }
.nav-btn svg, .tema-ic svg { width: 18px; height: 18px; display: block; }
.conexao { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 15px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.sinc { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; box-shadow: 0 0 0 3px var(--sunken); }
.sinc[data-st="ok"] { background: var(--ok-dot); }
.sinc[data-st="erro"] { background: var(--bad-dot); }
.casca.recolhido .aba span, .casca.recolhido .nav-btn span:not(.tema-ic), .casca.recolhido .marca-txt, .casca.recolhido #sinc-txt { display: none; }
.casca.recolhido .aba, .casca.recolhido .nav-btn { justify-content: center; padding: 0; }
.casca.recolhido .conexao { justify-content: center; padding: 0; }
.casca.recolhido #recolher svg { transform: rotate(180deg); }
.principal { min-width: 0; }
/* telas grandes: menu e conteúdo formam um bloco só, centralizado na tela */
@media (min-width: 1400px) {
  .casca { max-width: 1400px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--bg); }
  html { background: var(--sunken); }
}
.topo-cel, .abas-cel { display: none; }

main { max-width: 1120px; margin: 0 auto; padding: 32px 32px 64px; display: flex; flex-direction: column; gap: 20px; }
.cab { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
.cab .data { color: var(--muted); font-size: 13px; }

@media (max-width: 860px) {
  .casca, .casca.recolhido { display: block; }
  .lateral-nav { display: none; }
  .topo-cel { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 0; }
  .topo-cel .marca { padding: 0; }
  .so-icone { width: 44px; justify-content: center; padding: 0; }
  .abas-cel { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  .abas-cel .aba { flex-direction: column; justify-content: center; gap: 3px; height: 54px; padding: 0 2px; font-size: 10.5px; text-align: center; }
  .abas-cel .aba svg { width: 20px; height: 20px; }
  .abas-cel .aba[aria-current="page"] { background: none; color: var(--ink); }
  .abas-cel .aba.primaria { margin: 0 4px; border-radius: 14px; background: var(--accent); color: var(--accent-ink); }
  main { padding: 18px 16px calc(100px + env(safe-area-inset-bottom)); gap: 16px; }
}
@media (max-width: 860px) and (max-height: 520px) { .abas-cel { display: none; } }

/* ---------- cartões ---------- */
.painel, .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card { padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rot { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card-cab .lat { font-size: 12px; color: var(--muted); }
.grande { font-size: 34px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 400; }
.grande small { font-size: 13px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.linha-num { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 10px; }
.painel-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.painel-cab h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.painel-cab span { color: var(--muted); font-size: 12px; }
.painel-corpo { padding: 20px; }
.secao { display: flex; flex-direction: column; gap: 10px; }
.secao > h2 { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.link { color: var(--link); font-size: 12px; text-decoration: none; background: none; border: 0; cursor: pointer; padding: 12px 8px; margin: -12px -8px; text-transform: none; letter-spacing: 0; }
.link.perigo { color: var(--bad); }
.muted { color: var(--muted); }
.peq { font-size: 12px; }

/* blocos do painel */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c3 { grid-column: span 3; } .c7 { grid-column: span 7; } .c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1180px) { .c3, .c4, .c5 { grid-column: span 6; } .c6, .c8, .c7 { grid-column: span 12; } }
@media (max-width: 640px) { .bento > * { grid-column: span 12 !important; } }
.empurra { margin-top: auto; }
.pilha { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.pilha > .card { flex: 1; }
@media (max-width: 1180px) { .bento > .pilha { grid-column: span 12; flex-direction: row; } .pilha > .card { flex: 1 1 0; } }
@media (max-width: 640px) { .bento > .pilha { flex-direction: column; } }

/* pílulas de estado e variação */
.pill, .tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--neutro-soft); color: var(--neutro); }
.pill svg, .tag svg { width: 14px; height: 14px; }
[data-n="ok"].pill, [data-n="ok"].tag { background: var(--ok-soft); color: var(--ok); }
[data-n="bad"].pill, [data-n="bad"].tag { background: var(--bad-soft); color: var(--bad); }
[data-n="warn"].pill, [data-n="warn"].tag { background: var(--warn-soft); color: var(--warn); }
[data-n="info"].pill, [data-n="info"].tag { background: var(--info-soft); color: var(--info); }
[data-n="roxo"].pill, [data-n="roxo"].tag { background: var(--roxo-soft); color: var(--roxo); }
.delta { font-size: 12px; color: var(--muted); }
.delta b { font-weight: 500; }
.delta[data-n="ok"] b { color: var(--ok-dot); } .delta[data-n="bad"] b { color: var(--bad-dot); }
.ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }
.ponto[data-n="ok"] { background: var(--ok-dot); } .ponto[data-n="bad"] { background: var(--bad-dot); } .ponto[data-n="warn"] { background: var(--warn-dot); } .ponto[data-n="info"] { background: var(--h4); } .ponto[data-n="roxo"] { background: #8B5CF6; }

/* mapa de calor da agenda */
.mapa { display: grid; grid-template-columns: 34px repeat(var(--cols), 20px); grid-auto-rows: 20px; gap: 6px; align-items: center; justify-content: start; align-content: start; overflow-x: auto; padding: 3px; }
.mapa .dia { font-size: 11px; color: var(--muted); }
.mapa .dia.hoje { color: var(--ink); font-weight: 600; }
.cel { width: 20px; height: 20px; border-radius: 5px; background: var(--h0); }
.cel.n1 { background: var(--h1); } .cel.n2 { background: var(--h2); } .cel.n3 { background: var(--h3); } .cel.n4 { background: var(--h4); }
.cel.falta { background: var(--bad-dot); }
.cel.pend { background: var(--warn-dot); }
.cel.feriado { background: repeating-linear-gradient(135deg, var(--h0) 0 3px, var(--line-strong) 3px 4px); }
.cel.fora { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.cel.vazio { background: transparent; }
.cel.hoje { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
.mapa .eixo { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: visible; }
.mapa-leg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--muted); align-items: center; }
.mapa-leg .cel { width: 11px; height: 11px; border-radius: 3px; display: inline-block; vertical-align: -1px; margin-right: 5px; }


/* calendário do mês */
.cal-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.cal-titulo { display: flex; align-items: center; gap: 6px; }
.cal-titulo h2 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--faint); }
.cal-titulo h2 b { color: var(--ink); font-weight: 700; }
.cal-nav { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 10px; background: none; color: var(--muted); cursor: pointer; }
.cal-nav:hover { background: var(--sunken); color: var(--ink); }
.cal-nav:disabled { opacity: .3; cursor: default; background: none; }
.cal-nav svg { width: 18px; height: 18px; }
.vista { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 12px; }
.vista-b { width: 34px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--muted); cursor: pointer; }
.vista-b svg { width: 17px; height: 17px; }
.vista-b[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.cal-sem, .cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.cal-sem span { text-align: center; font-size: 10.5px; letter-spacing: .06em; padding: 5px 0; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.dia-c { position: relative; display: grid; place-items: center; aspect-ratio: 1.15; border-radius: 12px; background: var(--bg); color: var(--muted); font: inherit; font-size: 13px; border: 0; padding: 0; min-height: 40px; }
.dia-c.agenda { background: var(--sunken); color: var(--ink); }
.dia-c.antes { opacity: .45; }
.dia-c.fora-mes { background: transparent; box-shadow: inset 0 0 0 1px var(--line); opacity: .5; }
.dia-c.visita { background: var(--info-soft); color: var(--info); font-weight: 600; }
.dia-c.falta { background: var(--bad-soft); color: var(--bad); }
.dia-c.pend { background: var(--warn-soft); color: var(--warn); }
.dia-c.feriado { background: repeating-linear-gradient(135deg, var(--sunken) 0 5px, var(--bg) 5px 10px); }
.dia-c.hoje { box-shadow: 0 0 0 2px var(--ink); }
button.dia-c { cursor: pointer; }
button.dia-c:hover { filter: brightness(.96); }
:root[data-modo="escuro"] button.dia-c:hover { filter: brightness(1.2); }
.selo { position: absolute; right: 7px; bottom: 7px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; background: var(--line-strong); color: var(--ink); }
.selo svg { width: 11px; height: 11px; }
.selo[data-n="info"] { background: var(--accent); color: #fff; }
.selo[data-n="bad"] { background: var(--bad-dot); color: #fff; }
.selo[data-n="warn"] { background: var(--warn-dot); color: #fff; }
.cal-rodape { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
@media (max-width: 560px) {
  .cal-sem, .cal { gap: 5px; }
  .cal-sem span { font-size: 9.5px; letter-spacing: .02em; }
  .dia-c { border-radius: 10px; font-size: 12px; aspect-ratio: 1; min-height: 0; }
  .selo { right: 3px; bottom: 3px; min-width: 15px; height: 15px; font-size: 9.5px; padding: 0 3px; }
  .cal-titulo h2 { font-size: 22px; }
}

/* barras segmentadas dos mops */
.segs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 3px; height: 30px; }
.seg { border-radius: 3px; background: var(--line); }
.seg.b { background: var(--ink); }
.seg.v { background: var(--mop-red); }
.seg-leg { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
.seg-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* barras de semana (camisolas) */
.colunas { display: flex; align-items: flex-end; gap: 6px; height: 64px; }
.colunas .col { flex: 1; min-width: 6px; max-width: 18px; border-radius: 999px; background: var(--serie-a); }
.colunas .col.atual { background: var(--accent); }

/* listas */
.lista { list-style: none; margin: 0; padding: 0; }
.linha-reg { display: grid; grid-template-columns: 10px 84px minmax(0, 1fr) 80px 56px; gap: 12px; align-items: center; padding: 9px 0; font-size: 13px; cursor: pointer; border-radius: 8px; }
.linha-reg:hover { background: var(--sunken); }
.linha-reg .q { color: var(--ink); white-space: nowrap; }
.linha-reg .t { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.barra { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--faint); border-radius: 4px; }
.linha-reg:first-child .barra i { background: var(--accent); }
.linha-reg .v { text-align: right; }
@media (max-width: 640px) { .linha-reg { grid-template-columns: 10px 84px minmax(0, 1fr) 56px; } .linha-reg .barra { display: none; } }
.kv { display: flex; flex-direction: column; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 13px; }
.kv > div + div { border-top: 1px dashed var(--line); }
.kv dt, .kv .k { color: var(--ink); }
.kv .v { color: var(--muted); }

/* histórico */
.item { display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; gap: 4px 16px; align-items: start; padding: 14px 20px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item.clic { cursor: pointer; }
.item.clic:hover { background: var(--sunken); }
.quando { font-size: 12px; color: var(--muted); line-height: 1.45; }
.quando b { display: block; color: var(--ink); font-weight: 500; font-size: 13px; }
.mov { display: flex; flex-direction: column; gap: 3px; font-size: 13px; min-width: 0; }
.mov > div:not(.obs) { display: grid; grid-template-columns: 84px 70px minmax(0, 1fr); column-gap: 10px; align-items: baseline; }
.mov .l { color: var(--muted); }
.kgv { text-align: right; white-space: nowrap; }
.kgv small { color: var(--muted); font-size: 11px; }
.mov .obs { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; font-family: var(--sans); }
.lado { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.quem { font-size: 11px; color: var(--muted); white-space: nowrap; }
@media (max-width: 600px) {
  .item { grid-template-columns: 1fr auto; padding: 14px 16px; }
  .quando { grid-column: 1; display: flex; gap: 8px; align-items: baseline; }
  .quando b { display: inline; }
  .lado { grid-column: 2; grid-row: 1; }
  .mov { grid-column: 1 / -1; }
  .mov > div:not(.obs) { grid-template-columns: 74px 64px minmax(0, 1fr); }
}

/* avisos */
.aviso { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); }
.aviso .txt { flex: 1 1 280px; }
.aviso .txt.ic { display: flex; gap: 12px; align-items: flex-start; }
.aviso .txt > svg { width: 18px; height: 18px; margin-top: 1px; color: var(--muted); }
.aviso .txt strong { display: block; font-weight: 500; }
.aviso .txt span { color: var(--muted); font-size: 12.5px; font-family: var(--sans); }
.aviso[data-n="warn"] .txt > svg { color: var(--warn-dot); }
.aviso[data-n="bad"] { border-color: color-mix(in srgb, var(--bad-dot) 35%, var(--line)); }
.aviso[data-n="bad"] .txt > svg { color: var(--bad-dot); }

/* ---------- formulário ---------- */
.form { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }

input[type="text"], input[type="date"], input[type="month"], input[type="number"], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); font-size: 15px; }

.grupo { display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin: 0; min-width: 0; }

.grupo-cab span { font-size: 12px; color: var(--muted); }
.linha { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

@media (max-width: 560px) { .linha { grid-template-columns: 1fr 1fr; } .linha .largo { grid-column: 1 / -1; } .linha.topo-form { grid-template-columns: 1fr; } }
.kg { position: relative; }

.passo { display: grid; grid-template-columns: 46px 1fr 46px; height: 46px; border: 1px solid var(--line-strong); border-radius: 12px; overflow: hidden; background: var(--surface); }
.passo:hover { border-color: var(--campo); }

.alternar button { border: 0; background: transparent; min-height: 38px; padding: 0 8px; cursor: pointer; color: var(--muted); border-radius: 9px; white-space: nowrap; }
.alternar button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line); font-weight: 500; }
.opcoes { display: flex; flex-direction: column; gap: 8px; }
.opcao { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); cursor: pointer; font-size: 13px; }
.opcao:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

.conf { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; background: var(--sunken); font-size: 12.5px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--sunken); }

.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.06); }

.botoes { display: flex; flex-wrap: wrap; gap: 8px; }
@media (max-width: 960px) {
  .salvar-fixo { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 15; }

}

@media (max-width: 860px) and (max-height: 520px) { .salvar-fixo { bottom: 8px; } }

/* tabela */
.tabela-wrap { overflow-x: auto; }

.filtros { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }

/* relatório: texto para leiga em fonte sem serifa */
.rel { display: flex; flex-direction: column; gap: 22px; padding: 28px; }
.rel .titulo { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }

.sema { width: 100%; border-collapse: collapse; font-size: 14.5px; font-family: var(--sans); }
.sema th { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); width: 110px; padding: 14px 12px 14px 0; vertical-align: top; border-bottom: 1px solid var(--line); }

@media (max-width: 600px) {
  .rel { padding: 18px; }

  .sema tr { display: grid; grid-template-columns: 1fr auto; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .sema tr:last-child { border-bottom: 0; }
  .sema th, .sema td { border: 0; padding: 0; width: auto !important; }
  .sema td:last-child { grid-column: 1 / -1; margin-top: 6px; }
  table.visitas thead { display: none; }
  table.visitas, table.visitas tbody { display: block; }
  table.visitas tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  table.visitas tr.sem td[data-l] { display: none; }
  table.visitas td { border: 0; padding: 0; text-align: left !important; white-space: normal; }
  table.visitas td.dt { font-weight: 500; }
  table.visitas td.tp { text-align: right !important; color: var(--muted); }
  table.visitas td[data-l]::before { content: attr(data-l); display: block; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
}

.veu { position: fixed; inset: 0; background: rgba(9, 9, 11, .5); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.dialogo { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; max-width: 440px; width: 100%; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
.dialogo h2 { font-size: 16px; }
.dialogo p { color: var(--muted); font-family: var(--sans); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 60; background: var(--ink); color: var(--surface); padding: 4px 4px 4px 16px; min-height: 48px; border-radius: 14px; font-size: 13px; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.2); }
.toast:not(:has(button)) { padding-right: 16px; }
.toast button { background: transparent; color: inherit; border: 0; font-weight: 600; min-height: 44px; padding: 0 12px; text-decoration: underline; cursor: pointer; }
@media (min-width: 861px) { .toast { bottom: 24px; } }
.vazio { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.carregando { padding: 40px 0; color: var(--muted); }
.config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.dias { display: flex; flex-wrap: wrap; gap: 6px; }
.campo .dias label { text-transform: none; letter-spacing: 0; color: var(--ink); }
.dias label { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 12px; cursor: pointer; font-size: 13px; }
.dias label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }

/* escolha de tema */
.temas { display: grid; grid-template-columns: repeat(3, minmax(0, 150px)); gap: 14px; }
.tema { display: flex; flex-direction: column; gap: 8px; border: 0; background: none; padding: 0; cursor: pointer; text-align: left; color: var(--muted); font-size: 13px; }
.tema .mini { aspect-ratio: 16 / 10; border-radius: 12px; border: 1px solid var(--line-strong); overflow: hidden; display: grid; padding: 10px; gap: 5px; align-content: start; }
.tema .mini i { display: block; height: 5px; border-radius: 3px; }
.tema[aria-pressed="true"] { color: var(--ink); font-weight: 500; }
.tema[aria-pressed="true"] .mini { box-shadow: 0 0 0 2px var(--accent); border-color: transparent; }
.mini.claro { background: #F4F4F5; } .mini.claro i { background: #D4D4D8; }
.mini.escuro { background: #27272A; } .mini.escuro i { background: #52525B; }
.mini.sistema { background: linear-gradient(90deg, #F4F4F5 50%, #27272A 50%); } .mini.sistema i { background: linear-gradient(90deg, #D4D4D8 50%, #52525B 50%); }
.tema-nome { display: flex; align-items: center; gap: 6px; }
.tema-nome svg { width: 14px; height: 14px; }
.login { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; }
.login-caixa { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.login-caixa .marca { padding-bottom: 6px; }
.login .msg, .login .dica { max-width: 360px; text-align: center; }
#sair small { font-size: 11px; margin-left: 4px; }
.equipe-l { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 150px auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.equipe-l:first-child { border-top: 0; }
.equipe-l .em { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 640px) { .equipe-l { grid-template-columns: 1fr 1fr; } .equipe-l .em { grid-column: 1 / -1; } }

/* identidade eLavanderia: azul como cor da marca */
.logo { background: var(--accent); color: #fff; }
.aba[aria-current="page"]:not(.primaria) { background: var(--accent-soft); color: var(--info); }
.dia-c.hoje { box-shadow: 0 0 0 2px var(--accent); }
.vista-b[aria-pressed="true"] { background: var(--accent); color: #fff; }
.alternar button[aria-pressed="true"], .chip[aria-pressed="true"] { color: var(--info); }
.seg.b { background: var(--accent); }

.alternar.mini { grid-template-columns: auto auto; padding: 3px; gap: 3px; border-radius: 10px; }

.motivos { display: flex; flex-direction: column; gap: 8px; }

/* seletor de data */
.data-caixa { position: relative; }
.data-btn { width: 100%; min-height: 46px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 12px 0 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 15px; cursor: pointer; text-align: left; }
.data-btn:hover { border-color: var(--campo); }
.data-btn svg { width: 18px; height: 18px; color: var(--muted); }
.data-btn:disabled { opacity: .55; cursor: default; }
.data-pop { position: absolute; z-index: 40; top: calc(100% + 6px); left: 0; width: 304px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 18px 44px rgba(0,0,0,.16); display: flex; flex-direction: column; gap: 10px; }
.dp-cab { display: flex; align-items: center; justify-content: space-between; }

@media (max-width: 560px) {

  .dp-dia { height: 42px; }
}
[hidden] { display: none !important; }

/* ---------- checagem: contraste, aparelhos e ajustes ---------- */
:root[data-modo="escuro"] { --accent: #2563EB; --faint: #8A8A93; }
@media (prefers-color-scheme: dark) { :root[data-modo="sistema"] { --accent: #2563EB; --faint: #8A8A93; } }
.cal-titulo h2 { color: var(--muted); white-space: nowrap; }
.selo[data-n="warn"] { color: #451A03; }
.selo[data-n="bad"] { background: #BE123C; }

.seg { box-shadow: inset 0 0 0 1px var(--line-strong); }
.colunas .col { background: var(--campo); }

input[type="password"], input[type="email"] { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--campo); border-radius: 12px; background: var(--surface); font-size: 15px; }
input[type="text"], input[type="date"], input[type="month"], input[type="number"], select, textarea, .data-btn, .passo, .opcao { border-color: var(--campo); }
.alternar button[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--accent); font-weight: 600; }
.motivos .chips { background: transparent; padding: 0; gap: 6px; }

.motivos .chip[aria-pressed="true"] { border-color: var(--accent); }
.alternar button { min-height: 44px; }
.conf .tag { background: var(--surface); }
/* calendário: dias fora da agenda só com contorno + legenda */

.dia-c.agenda, .dia-c.visita, .dia-c.falta, .dia-c.pend, .dia-c.feriado { box-shadow: none; }

.cal-cab { flex-wrap: wrap; }
@media (max-width: 560px) {

  .dia-c .selo svg { display: none; }
}
/* histórico: navegação de mês e filtros */
.mes-nav h2 { font-size: 20px; }
.cal-nav { min-width: 44px; min-height: 44px; }
.cal-nav:disabled { opacity: .35; cursor: default; }
@media (max-width: 860px) {
  .filtros .chips { flex-wrap: nowrap; overflow-x: auto; max-width: 100%; scrollbar-width: none; }

}

@media (max-width: 860px) { .so-pc { display: none; } }
/* formulário: mensagem junto do salvar */
.salvar-fixo { flex-wrap: wrap; }

.salvar-fixo .msg:empty { display: none; }
@media (max-width: 860px) { .salvar-fixo .msg:not(:empty) { background: var(--surface); padding: 10px 12px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.12); } }
html { scroll-padding-bottom: 170px; }

/* toast no topo no celular (não cobre o botão Salvar) */

/* menu lateral */

.lateral-nav > * { flex-shrink: 0; }
.casca.recolhido .aba span, .casca.recolhido .nav-btn span:not(.tema-ic) { display: inline; position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.config-grid { grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); }
/* celular deitado / dobrável: menu compacto em vez de sumir */
@media (max-width: 860px) and (max-height: 520px) {
  .abas-cel { display: grid; padding: 2px 6px calc(2px + env(safe-area-inset-bottom)); }

  .abas-cel .aba svg { width: 18px; height: 18px; }
  main { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }

  .data-pop { position: fixed; top: 8px; bottom: 8px; max-height: calc(100vh - 16px); overflow-y: auto; left: 50%; right: auto; transform: translateX(-50%); width: 304px; }
}

/* alvos de toque no toque (44px) */

          obs: d.obs || '', por: nulo(d.por), em: nulo(d.em) || new Date().toISOString(), edit_por: nulo(d.editPor), edit_em: nulo(d.editEm) };
      },
      paraDoc: function (r) {

      }
    },
    ajustes: {
      tabela: 'lav_ajustes', chave: 'id',
      paraLinha: function (id, d) {
        return { id: id, data: d.data, motivo: d.motivo, item: d.item === 'vm' ? 'vm' : 'br', qtd: +d.qtd || 0,
          aqui_br: d.aquiBr == null ? null : +d.aquiBr, aqui_vm: d.aquiVm == null ? null : +d.aquiVm,
          obs: d.obs || '', por: nulo(d.por), em: nulo(d.em) || new Date().toISOString() };
      },
      paraDoc: function (r) {
        return { data: r.data, motivo: r.motivo, item: r.item, qtd: r.qtd, aquiBr: r.aqui_br, aquiVm: r.aqui_vm, obs: r.obs || '', por: r.por, em: iso(r.em) };
      }
    },
    feriados: {
      tabela: 'lav_feriados', chave: 'data',
      paraLinha: function (id, d) { return { data: d.data || id, nome: d.nome || 'Feriado', por: nulo(d.por), em: nulo(d.em) || new Date().toISOString() }; },
      paraDoc: function (r) { return { data: r.data, nome: r.nome, por: r.por, em: iso(r.em) }; }
    },
    config: {
      tabela: 'lav_config', chave: 'id',
      paraLinha: function (id, d) {
        var s = d.saldoIni || {};
        return { id: 1, dias: d.dias, inicio: nulo(d.inicio), suj_min: d.sujMin, suj_max: d.sujMax, total_br: d.totalBr, total_vm: d.totalVm,
          saldo_cam: +s.cam || 0, saldo_br: +s.br || 0, saldo_vm: +s.vm || 0, edit_por: nulo(d.editPor), edit_em: nulo(d.editEm) };
      },
      paraDoc: function (r) {
        return { dias: r.dias, inicio: r.inicio, sujMin: +r.suj_min, sujMax: +r.suj_max, totalBr: r.total_br, totalVm: r.total_vm,
          saldoIni: { cam: +r.saldo_cam, br: r.saldo_br, vm: r.saldo_vm }, editPor: r.edit_por, editEm: iso(r.edit_em) };

  };

  function erro(e) {

    if (e.code === '42501' || /row-level security|permission denied/i.test(msg)) return { code: 'invalid_argument', message: msg };

  /** Lê a tabela inteira em páginas de 1000 (o Supabase corta em 1000 por consulta).

  function carregar(nome) {
    var m = MAPA[nome], todas = [];
    var pagina = function (de) {
      return sb.from(m.tabela).select('*').order(m.chave).range(de, de + 999).then(exigir).then(function (r) {
        todas = todas.concat(r.data || []);

    var m = MAPA[nome];

    return {
      id: id, path: nome + '/' + id,
      get: function () {
        return filtro(sb.from(m.tabela).select('*')).maybeSingle().then(exigir).then(function (r) {
          var d = r.data ? m.paraDoc(r.data) : undefined;
          return { id: id, exists: !!r.data, data: function () { return d; }, metadata: { fromCache: false, hasPendingWrites: false } };

      },
      set: function (dados) {
        return sb.from(m.tabela).upsert(m.paraLinha(id, dados), { onConflict: nome === 'config' ? 'id' : m.chave }).select().then(exigir).then(function (r) {

      },
      update: function (dados) { return this.set(dados); },
      delete: function () {

          if (!r.data || !r.data.length) throw { code: 'invalid_argument', message: 'nada excluído (sem permissão ou já excluído)' };

      onSnapshot: function (next, err) {

          var d = r ? m.paraDoc(r) : undefined;
          next({ id: id, exists: !!r, data: function () { return d; }, metadata: { fromCache: false, hasPendingWrites: false } });
        }, err: err };
        (ouvintes[nome] = ouvintes[nome] || []).push(o);
        ligarTempoReal(); avisar(nome);
        return function () { ouvintes[nome] = ouvintes[nome].filter(function (x) { return x !== o; }); };
      }
    };
  }
  function novoId() { return 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function colRef(nome) {
    if (!MAPA[nome]) throw new TypeError('coleção desconhecida: ' + nome);
    return {
      path: nome,
      doc: function (id) { return docRef(nome, id || novoId()); },
      onSnapshot: function (next, err) {
        var o = { fn: function (linhas) { next(snapLista(nome, linhas)); }, err: err };
        (ouvintes[nome] = ouvintes[nome] || []).push(o);
        ligarTempoReal(); avisar(nome);
        return function () { ouvintes[nome] = ouvintes[nome].filter(function (x) { return x !== o; }); };
      },
      get: function () { return carregar(nome).then(function (l) { return snapLista(nome, l); }); }
    };
  }
  var db = {
    doc: function (caminho) { var p = caminho.split('/'); return docRef(p[0], p[1]); },
    collection: colRef
  };

  // ---------- quem está usando ----------
  var cacheNomes = {};
  var user = {
    id: function () { return Promise.resolve(sessao ? sessao.user.id : null); },
    canEdit: function () { return Promise.resolve(!!perfil && perfil.papel === 'admin'); },
    isOwner: function () { return Promise.resolve(!!perfil && perfil.papel === 'admin'); },
    can: function (n) { return Promise.resolve(n === 'data.write' ? !!perfil && (perfil.papel === 'admin' || perfil.papel === 'equipe') : false); },
    me: function () { return Promise.resolve({ id: sessao ? sessao.user.id : null, name: perfil ? perfil.nome : '', email: sessao ? sessao.user.email : null }); },
    profiles: function (ids) {
      ids = [].concat(ids || []);
      var faltam = ids.filter(function (i) { return !cacheNomes[i]; });
      var busca = faltam.length ? sb.from('lav_perfis').select('id, nome, email').in('id', faltam).then(function (r) {
        (r.data || []).forEach(function (p) { cacheNomes[p.id] = { id: p.id, name: p.nome || p.email.split('@')[0] }; });
      }) : Promise.resolve();

  };

  // ---------- login ----------
  function mostrarLogin(msg) {
    var tela = document.getElementById('login');
    if (sessao && msg) { var sair = document.getElementById('login-sair'); if (!sair) { sair = document.createElement('button'); sair.type = 'button'; sair.id = 'login-sair'; sair.className = 'link'; sair.textContent = 'Entrar com outra conta'; sair.onclick = function () { sb.auth.signOut(); }; tela.appendChild(sair); } }
    tela.hidden = false;
    var m = document.getElementById('login-msg'); m.textContent = msg || '';
    var f = document.getElementById('login-form');
    f.onsubmit = function (e) {
      e.preventDefault();
      var email = document.getElementById('login-email').value.trim(), senha = document.getElementById('login-senha').value;
      var bt = document.getElementById('login-entrar'); bt.disabled = true; bt.textContent = 'Entrando…'; m.textContent = '';
      sb.auth.signInWithPassword({ email: email, password: senha }).then(function (r) {
        bt.disabled = false; bt.textContent = 'Entrar';
        if (r.error) { m.textContent = /invalid/i.test(r.error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + r.error.message; return; }
        sessao = r.data.session; entrar();
      }, function () { bt.disabled = false; bt.textContent = 'Entrar'; m.textContent = 'Sem conexão. Confira a internet e tente de novo.'; });
    };
    document.getElementById('login-email').focus();
  }
  function entrar() {
    sb.from('lav_perfis').select('id, email, nome, papel').eq('id', sessao.user.id).maybeSingle().then(function (r) {
      if (r.error) { mostrarLogin('Não foi possível carregar seu perfil. Confira a internet e toque em Entrar de novo.'); return; }
      if (!r.data || ['admin', 'equipe', 'leitor'].indexOf(r.data.papel) < 0) { mostrarLogin('Seu acesso ainda não foi liberado. Peça ao responsável para liberar em Ajustes › Equipe.'); return; }
      perfil = r.data;
      document.getElementById('login').hidden = true;
      var q = document.getElementById('quem'); if (q) q.textContent = (perfil.nome || sessao.user.email) + ({ admin: ' · responsável', equipe: ' · registra', leitor: ' · só vê' }[perfil.papel] || '');
      liberar(true);
    }, function () { mostrarLogin('Não foi possível carregar seu perfil. Tente de novo.'); });
  }

  if (!window.supabase || !C.url || !C.chave || /COLE/.test(C.url + C.chave)) {
    document.addEventListener('DOMContentLoaded', function () {
      var l = document.getElementById('login'); l.hidden = false;
      document.getElementById('login-form').hidden = true;

    });

  var iniciar = function () {
    sb.auth.getSession().then(function (r) {
      sessao = r.data && r.data.session;
      if (sessao) entrar(); else mostrarLogin();

})();

<script>/* logica.js */
/* Regras de negócio da lavanderia. Funções puras: recebem o estado e a data de hoje.
   Usado pela página (window.Lav) e pelos testes (require). */
(function (raiz) {
  'use strict';

  var PADRAO = {
    dias: [1, 3, 5],            // seg, qua, sex
    inicio: null,               // primeiro dia controlado (AAAA-MM-DD)
    sujMin: 8,                  // % do peso sujo que é sujeira e umidade (mín.)
    sujMax: 15,                 // idem (máx.)
    totalBr: 16,                // mops brancos da empresa (base, antes de compras e descartes)
    totalVm: 6,                 // mops vermelhos
    saldoIni: { cam: 0, br: 0, vm: 0 } // já com a lavanderia no início (cam em kg sujos)
  };
  var ATRASO_DIAS = 7;          // leva aberta há mais que isso vira pendência

  // ---------- datas (sempre AAAA-MM-DD, horário local) ----------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function somaDias(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function diasEntre(a, b) { return Math.round((parse(b) - parse(a)) / 864e5); }
  function diaSemana(s) { return parse(s).getDay(); }
  function inicioMes(s) { return s.slice(0, 8) + '01'; }
  function fimMes(s) { var d = parse(inicioMes(s)); d.setMonth(d.getMonth() + 1); d.setDate(0); return iso(d); }
  function inicioSemana(s) { var w = diaSemana(s); return somaDias(s, w === 0 ? -6 : 1 - w); }
  function dataValida(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && iso(parse(s)) === s; }
  /** Data local de um carimbo ISO (UTC) — "registrado em". */
  function dataLocal(isoTs) { var d = new Date(isoTs); return isNaN(d) ? null : iso(d); }

  // ---------- números ----------
  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  function r2(n) { return Math.round(n * 100) / 100; }
  /** Lê o que a pessoa digitou: "38,5", "38.5", "1.234,5", "1.234" (milhar). NaN se inválido; 0 se vazio. */
  function lerNumero(txt) {
    var s = String(txt == null ? '' : txt).trim().replace(/\s/g, '');
    if (s === '') return 0;
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    else if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    if (!/^-?\d+(\.\d+)?$/.test(s)) return NaN;
    return Number(s);
  }

  // ---------- normalização do que vem do banco ----------
  function config(doc) {
    var d = doc || {};
    var c = {
      dias: Array.isArray(d.dias) ? d.dias.map(Number).filter(function (x) { return x >= 0 && x <= 6; }) : PADRAO.dias.slice(),
      inicio: dataValida(d.inicio) ? d.inicio : null,
      sujMin: d.sujMin != null ? num(d.sujMin) : PADRAO.sujMin,
      sujMax: d.sujMax != null ? num(d.sujMax) : PADRAO.sujMax,
      totalBr: d.totalBr != null ? Math.round(num(d.totalBr)) : PADRAO.totalBr,
      totalVm: d.totalVm != null ? Math.round(num(d.totalVm)) : PADRAO.totalVm,
      saldoIni: {
        cam: Math.max(0, num(d.saldoIni && d.saldoIni.cam)),
        br: Math.max(0, Math.round(num(d.saldoIni && d.saldoIni.br))),
        vm: Math.max(0, Math.round(num(d.saldoIni && d.saldoIni.vm)))
      }
    };
    if (c.sujMin > c.sujMax) { var t = c.sujMin; c.sujMin = c.sujMax; c.sujMax = t; }
    return c;
  }

  function visita(id, d) {
    d = d || {};
    var l = d.levou || {}, t = d.trouxe || {};
    var falta = d.status === 'falta';
    return {
      id: id,
      data: dataValida(d.data) ? d.data : '1970-01-01',
      falta: falta,
      motivo: falta ? (['lavanderia', 'feriado', 'outro'].indexOf(d.motivo) >= 0 ? d.motivo : 'lavanderia') : '',
      urgencia: !falta && !!d.urgencia,
      levou: { cam: Math.max(0, num(l.cam)), br: Math.max(0, Math.round(num(l.br))), vm: Math.max(0, Math.round(num(l.vm))) },
      trouxe: { cam: Math.max(0, num(t.cam)), pecas: Math.max(0, Math.round(num(t.pecas))), br: Math.max(0, Math.round(num(t.br))), vm: Math.max(0, Math.round(num(t.vm))) },
      semLevar: !falta && typeof d.semLevar === 'string' ? d.semLevar : '',
      semTrazer: !falta && typeof d.semTrazer === 'string' ? d.semTrazer : '',
      obs: typeof d.obs === 'string' ? d.obs : '',
      por: typeof d.por === 'string' ? d.por : null,
      em: typeof d.em === 'string' ? d.em : '',
      editPor: typeof d.editPor === 'string' ? d.editPor : null,
      editEm: typeof d.editEm === 'string' ? d.editEm : ''
    };
  }
  function ordem(a, b) { return a.data < b.data ? -1 : a.data > b.data ? 1 : (a.em < b.em ? -1 : a.em > b.em ? 1 : (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)); }

  /** Ajuste de mops. motivo 'contagem' guarda o que foi CONTADO aqui (absoluto); os outros mudam o total. */
  function ajuste(id, d) {
    d = d || {};
    var cont = d.motivo === 'contagem';
    return {
      id: id,
      data: dataValida(d.data) ? d.data : '1970-01-01',
      motivo: ['compra', 'descarte', 'perda', 'contagem'].indexOf(d.motivo) >= 0 ? d.motivo : 'outro',
      item: d.item === 'vm' ? 'vm' : 'br',
      qtd: cont ? 0 : Math.round(num(d.qtd)),
      aquiBr: cont ? Math.max(0, Math.round(num(d.aquiBr))) : null,
      aquiVm: cont ? Math.max(0, Math.round(num(d.aquiVm))) : null,
      obs: typeof d.obs === 'string' ? d.obs : '',
      por: typeof d.por === 'string' ? d.por : null,
      em: typeof d.em === 'string' ? d.em : ''

  }

  /** Monta o estado a partir dos documentos crus. */
  function estado(cfgDoc, visitasDocs, ajustesDocs, feriadosDocs) {
    var fer = {};
    (feriadosDocs || []).forEach(function (f) {
      var d = f.data || {};
      var data = dataValida(d.data) ? d.data : f.id;
      if (dataValida(data)) fer[data] = { id: f.id, nome: typeof d.nome === 'string' && d.nome ? d.nome : 'Feriado' };
    });

      cfg: config(cfgDoc),
      visitas: (visitasDocs || []).map(function (v) { return visita(v.id, v.data); }).sort(ordem),
      ajustes: (ajustesDocs || []).map(function (a) { return ajuste(a.id, a.data); }).sort(ordem),
      feriados: fer

    return E;

  /** Mapa de calor da agenda: colunas = semanas, linhas = seg a sáb. */

    E.visitas.forEach(function (v) { (porData[v.data] = porData[v.data] || []).push(v); if (!v.falta) max = Math.max(max, v.levou.cam); });

    for (var d = 1; d <= 6; d++) {

      for (var w = 0; w < semanas; w++) {

      '<div class="linha dois">' + passo('tbr', 'Mops brancos', 'devolvidos', f.tbr) + passo('tvm', 'Mops vermelhos', 'devolvidos', f.tvm, 'done') + '</div></div>' + motivos('t', SEM_TRAZER, f.motivoT) +

    h += '<fieldset id="bloco-falta" class="grupo" style="margin:0"' + (f.falta ? '' : ' hidden') + '><h2>Por que não teve visita?</h2><div class="opcoes" role="radiogroup">' +
      [['lavanderia', 'A lavanderia não veio'], ['feriado', 'Feriado'], ['outro', 'Outro motivo (não é culpa da lavanderia)']].map(function (o) {
        return '<label class="opcao"><input type="radio" name="motivo" value="' + o[0] + '"' + (f.motivo === o[0] ? ' checked' : '') + '>' + o[1] + '</label>';
      }).join('') + '</div></fieldset>';

    h += '<div class="campo"><label for="f-obs">Observação <span class="muted" style="font-weight:400">(opcional)</span></label><textarea id="f-obs" maxlength="500">' + esc(f.obs) + '</textarea></div>';
    h += '</div>';

    h += '<aside class="lateral"><div class="painel resumo-form"><div class="painel-cab"><h2>Com a lavanderia</h2><span>antes → depois</span></div><div class="painel-corpo" id="f-lado"></div></div>';
    if (f.id) {
      var o = f.original;
      h += (podeApagar(o) ? '<button type="button" class="btn perigo" id="f-excluir" style="align-self:flex-start">Excluir este registro</button>' : '<p class="peq muted">Só o responsável pode excluir este registro.</p>') +
        '<p class="peq muted">Registrado' + (o.por ? ' por ' + esc(nome(o.por)) : '') + (o.em && L.dataLocal(o.em) ? ' em ' + dma(L.dataLocal(o.em)) : '') + (o.editPor ? '. Última alteração por ' + esc(nome(o.editPor)) + '.' : '.') + '</p>';
    }
    h += '<div class="salvar-fixo botoes"><p class="msg" id="f-msg" role="alert"></p><button type="submit" class="btn pri grande" id="f-salvar">' + (f.id ? 'Salvar alterações' : 'Salvar visita') + '</button>' +
      (f.id ? '<button type="button" class="btn grande" id="f-cancelar">Cancelar</button>' : '') + '</div>';
    h += '</aside></form>';
    return h;
  }

  function g(id) { return document.getElementById('f-' + id); }
  /** Inteiro digitado: '' vira 0; qualquer coisa que não seja só dígitos vira NaN. */
  function inteiro(v) { var t = String(v == null ? '' : v).trim(); if (t === '') return 0; return /^\d+$/.test(t) ? parseInt(t, 10) : NaN; }
  function inteiroOu0(v) { var n = inteiro(v); return isFinite(n) ? n : 0; }
  function lerForm() {
    if (!form || !g('data')) return;
    form.data = g('data').value;
    form.lcam = g('lcam').value; form.tcam = g('tcam').value; form.tpecas = g('tpecas').value;
    ['lbr', 'lvm', 'tbr', 'tvm'].forEach(function (k) { form[k] = inteiro(g(k).value); });
    form.urgencia = g('urg').checked;
    var m = document.querySelector('input[name="motivo"]:checked'); form.motivo = m ? m.value : 'lavanderia';
    form.obs = g('obs').value;
  }
  function visitaDoForm() {
    var lc = L.lerNumero(form.lcam), tc = L.lerNumero(form.tcam), tp = L.lerNumero(form.tpecas);
    return L.visita(form.id || form.novoId, {
      data: form.data, status: form.falta ? 'falta' : 'realizada', motivo: form.motivo, urgencia: form.urgencia,
      levou: form.levouSim ? { cam: isFinite(lc) ? lc : 0, br: form.lbr || 0, vm: form.lvm || 0 } : {},
      trouxe: form.trouxeSim ? { cam: isFinite(tc) ? tc : 0, pecas: isFinite(tp) ? tp : 0, br: form.tbr || 0, vm: form.tvm || 0 } : {},
      semLevar: form.levouSim ? '' : (form.motivoL || 'outro'), semTrazer: form.trouxeSim ? '' : (form.motivoT || 'outro'),
      em: form.original ? form.original.em : agoraISO()
    });
  }
  function comVisita(vs) { return { cfg: E.cfg, feriados: E.feriados, ajustes: E.ajustes, visitas: vs.slice().sort(L.ordem) }; }

  function atualizarLateral() {
    if (!formNaTela || !form || !g('data')) return;
    var d = form.data, dia = g('dia'), lado = g('lado'), conf = g('conf');
    if (!L.dataValida(d)) { dia.textContent = 'Escolha uma data.'; lado.innerHTML = ''; conf.innerHTML = ''; return; }
    var fer = E.feriados[d];
    var outras = E.visitas.filter(function (v) { return v.data === d && v.id !== form.id; });
    var txt = cap(DIAS_LONGO[L.diaSemana(d)]) + ': ';
    if (E.cfg.inicio && d < E.cfg.inicio) txt += 'antes do início do controle (' + dma(E.cfg.inicio) + ').';
    else if (fer) txt += 'feriado (' + fer.nome + ').';
    else if (L.ehPrevisto(E, d)) txt += 'dia da agenda.';
    else txt += 'fora da agenda.';
    if (form.falta && !L.ehPrevisto(E, d)) txt += ' Não era dia combinado: se a lavanderia não veio, não precisa registrar.';
    dia.innerHTML = esc(txt) + (outras.length ? ' <strong style="color:var(--warn)">Já existe ' + (outras.length === 1 ? 'um registro' : outras.length + ' registros') + ' neste dia (' + esc(outras.map(function (o) { return o.falta ? 'falta' : o.por === meuId ? 'sua visita' : 'visita de ' + nome(o.por); }).join(', ')) + ').</strong>' : '');

    var semEsta = comVisita(E.visitas.filter(function (v) { return v.id !== form.id; }));
    var vNova = visitaDoForm();
    var comNova = comVisita(semEsta.visitas.concat([vNova]));
    var ate = d > hoje() ? d : hoje();
    var antesM = L.mops(semEsta, ate), depoisM = L.mops(comNova, ate);
    var antesC = L.conciliacao(semEsta, ate), depoisC = L.conciliacao(comNova, ate);

    // o que esta devolução faz com as coletas em aberto
    var ch = '';
    if (!form.falta && vNova.trouxe.cam > 0) {
      var info = depoisC.porVisita[vNova.id];
      if (info) {
        info.abate.forEach(function (x) {
          var l = x.leva;
          var nomeL = l.inicial ? 'O que já estava com a lavanderia' : 'Roupa levada em ' + dsem(l.data) + ' ' + dm(l.data);
          ch += '<div><b>' + nomeL + '</b>: ' + fkg(l.sujo) + ' kg sujos, esperado ' + fkg(l.esperado.lo) + '–' + fkg(l.esperado.hi) + ' kg limpos. ' +
            (l.fechadaEm ? '<span class="tag" data-n="ok">Completa</span>' : '<span class="tag">Faltam ~' + fkg(l.falta) + ' kg</span>') + '</div>';
        });
        if (info.sobra) ch += '<div><span class="tag" data-n="warn">' + fkg(info.sobra) + ' kg a mais</span> <span class="muted">do que as coletas em aberto. Falta registrar alguma coleta?</span></div>';
      }
    }
    conf.innerHTML = ch;

    var avisos = [];
    if (!form.falta) {
      var foraB = Math.max(0, L.mops(semEsta, d).br.fora), foraV = Math.max(0, L.mops(semEsta, d).vm.fora);
      if (form.tbr > foraB) avisos.push('Trouxeram ' + form.tbr + ' brancos, mas pelos registros só ' + foraB + ' estavam com a lavanderia.');
      if (form.tvm > foraV) avisos.push('Trouxeram ' + form.tvm + ' vermelhos, mas pelos registros só ' + foraV + ' estavam com a lavanderia.');
    }
    lado.innerHTML = '<dl>' +
      '<dt>Mops brancos</dt><dd>' + antesM.br.fora + ' → <b>' + depoisM.br.fora + '</b></dd>' +
      '<dt>Mops vermelhos</dt><dd>' + antesM.vm.fora + ' → <b>' + depoisM.vm.fora + '</b></dd>' +
      '<dt>Camisolas (limpo)</dt><dd>' + fkg(antesC.aDevolver.med) + ' → <b>' + fkg(depoisC.aDevolver.med) + '</b> kg</dd>' +
      '</dl>' + (avisos.length ? '<p class="msg" data-n="warn" style="margin-top:12px">' + avisos.map(esc).join('<br>') + '</p>' : '');
  }

  function ligarForm() {
    var el = document.getElementById('form');
    el.addEventListener('input', function (e) {
      if (e.target.id === 'f-lcam' || e.target.id === 'f-tcam') e.target.removeAttribute('aria-invalid');
      lerForm(); atualizarLateral();
    });
    el.addEventListener('change', function (e) {
      var k = e.target.id && e.target.id.slice(2);
      if (['lbr', 'lvm', 'tbr', 'tvm', 'tpecas'].indexOf(k) >= 0) e.target.setAttribute('aria-invalid', String(!isFinite(inteiro(e.target.value))));
      lerForm(); atualizarLateral();
    });
    el.addEventListener('focusin', function (e) { if (e.target.closest('.passo') || e.target.id === 'f-tpecas') { try { e.target.select(); } catch (x) {} } });
    // Enter avança para o próximo campo em vez de salvar
    el.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' || e.target.tagName !== 'INPUT' || e.target.type === 'checkbox' || e.target.type === 'radio') return;
      e.preventDefault();
      var cs = Array.prototype.filter.call(el.querySelectorAll('input[type="text"], textarea'), function (x) { return !x.closest('[hidden]'); });
      var i = cs.indexOf(e.target);
      var prox = cs[i + 1];
      if (prox && prox.id !== 'f-obs') prox.focus(); else { e.target.blur(); document.getElementById('f-salvar').focus({ preventScroll: true }); }
    });
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.passo) {
        var inp = g(b.dataset.passo);
        inp.value = Math.max(0, inteiroOu0(inp.value) + (+b.dataset.d)); inp.removeAttribute('aria-invalid'); lerForm(); atualizarLateral();
      } else if (b.dataset.lado) {
        var lado = b.dataset.lado, sim = b.dataset.sim === '1';
        form[lado === 'l' ? 'levouSim' : 'trouxeSim'] = sim;
        b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        document.getElementById('corpo-' + lado).hidden = !sim;
        document.getElementById('mot-' + lado).hidden = sim;
        msgForm(''); atualizarLateral();
      } else if (b.dataset.mot) {
        var k = b.dataset.mot === 'l' ? 'motivoL' : 'motivoT';
        form[k] = form[k] === b.dataset.cod ? '' : b.dataset.cod;
        b.parentNode.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.cod === form[k])); });
      } else if (b.dataset.veio) {
        form.falta = b.dataset.veio === '0';
        el.querySelectorAll('[data-veio]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        document.getElementById('bloco-veio').hidden = form.falta;
        document.getElementById('bloco-falta').hidden = !form.falta;
        msgForm('');
        atualizarLateral();
      }
    });
    el.addEventListener('submit', function (e) { e.preventDefault(); salvarForm(); });
    var canc = g('cancelar'); if (canc) canc.onclick = function () { form = null; ir('historico'); };
    var exc = g('excluir'); if (exc) exc.onclick = excluirVisita;
    lerForm(); atualizarLateral();
    if (!form.id && !form.falta && !form.lcam && !(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) g('lcam').focus({ preventScroll: true });
  }
  function msgForm(txt, n) { var m = g('msg'); if (m) { m.textContent = txt; m.dataset.n = n || 'bad'; } }

  function salvarForm() {
    if (salvando || !db) return;
    lerForm();
    var t = hoje(), f = form;
    if (!f.id && f.dia && f.data === f.dia && f.dia !== t) { f.data = f.dia = t; desenhar(); return msgForm('Virou o dia: a data mudou para hoje (' + dma(t) + '). Confira e salve.', 'warn'); }
    if (!L.dataValida(f.data)) return msgForm('Escolha uma data válida.');
    if (f.data > t) return msgForm('A data não pode ser no futuro.');
    var moverInicio = E.cfg.inicio && f.data < E.cfg.inicio;
    if (moverInicio && !ehAdmin) return msgForm('Essa data é antes do início do controle (' + dma(E.cfg.inicio) + '). Peça ao responsável para lançar ou mudar o início em Ajustes.');
    var corpo = { data: f.data, status: f.falta ? 'falta' : 'realizada', urgencia: false, motivo: '', obs: f.obs.trim().slice(0, 500),
      levou: { cam: 0, br: 0, vm: 0 }, trouxe: { cam: 0, pecas: 0, br: 0, vm: 0 } };
    var checar = [];
    if (f.falta) corpo.motivo = f.motivo;
    else {
      var lc = L.lerNumero(f.lcam), tc = L.lerNumero(f.tcam), tp = L.lerNumero(f.tpecas);
      if (!isFinite(lc) || lc < 0) { g('lcam').setAttribute('aria-invalid', 'true'); g('lcam').focus(); return msgForm('O peso levado não é um número. Use, por exemplo, 42,5.'); }
      if (!isFinite(tc) || tc < 0) { g('tcam').setAttribute('aria-invalid', 'true'); g('tcam').focus(); return msgForm('O peso devolvido não é um número. Use, por exemplo, 38,2.'); }
      if (!isFinite(tp) || tp < 0 || Math.round(tp) !== tp) { g('tpecas').focus(); return msgForm('Peças precisa ser um número inteiro, sem vírgula.'); }
      var ruim = ['lbr', 'lvm', 'tbr', 'tvm'].filter(function (k) { return !isFinite(f[k]); })[0];
      if (ruim) { g(ruim).setAttribute('aria-invalid', 'true'); g(ruim).focus(); return msgForm('Quantidade de mops precisa ser um número inteiro.'); }
      var mAntes = L.mops(comVisita(E.visitas.filter(function (v) { return v.id !== f.id; })), f.data);
      if (f.lbr > Math.max(0, mAntes.br.aqui) + f.tbr) checar.push('Levaram ' + f.lbr + ' mops brancos, mas pelos registros só havia ' + Math.max(0, mAntes.br.aqui) + ' aqui.');
      if (f.lvm > Math.max(0, mAntes.vm.aqui) + f.tvm) checar.push('Levaram ' + f.lvm + ' mops vermelhos, mas pelos registros só havia ' + Math.max(0, mAntes.vm.aqui) + ' aqui.');
      if (!f.levouSim) { lc = 0; f.lbr = 0; f.lvm = 0; }
      if (!f.trouxeSim) { tc = 0; tp = 0; f.tbr = 0; f.tvm = 0; }
      if (f.levouSim && !lc && !f.lbr && !f.lvm) { g('lcam').focus(); return msgForm('Preencha o que a lavanderia levou, ou marque "Não" em "A lavanderia levou roupa suja?".'); }
      if (f.trouxeSim && !tc && !tp && !f.tbr && !f.tvm) { g('tcam').focus(); return msgForm('Preencha o que a lavanderia trouxe, ou marque "Não" em "A lavanderia trouxe roupa limpa?".'); }
      if (!f.levouSim && !f.trouxeSim && !f.motivoL && !f.motivoT) return msgForm('Se não levaram nem trouxeram nada, escolha o motivo em pelo menos um dos dois.');
      if (tp > 0 && !tc) { g('tcam').focus(); return msgForm('Informe também o peso das camisolas devolvidas.'); }
      [['levado', lc], ['devolvido', tc]].forEach(function (x) { if (x[1] > 200) checar.push('O peso ' + x[0] + ' é ' + fkg(x[1]) + ' kg, acima do comum.'); else if (x[1] > 0 && x[1] < 2) checar.push('O peso ' + x[0] + ' é ' + fkg(x[1]) + ' kg, abaixo do comum.'); });
      corpo.urgencia = f.urgencia;
      corpo.levou = { cam: L.r2(lc), br: f.lbr, vm: f.lvm };
      corpo.trouxe = { cam: L.r2(tc), pecas: tp, br: f.tbr, vm: f.tvm };
      var comum = function (m) { return m === 'erro' || m === 'feriado' ? m : ''; };
      corpo.semLevar = f.levouSim ? '' : (f.motivoL || comum(f.motivoT) || 'outro');
      corpo.semTrazer = f.trouxeSim ? '' : (f.motivoT || comum(f.motivoL) || 'outro');
    }
    var mesmas = E.visitas.filter(function (v) { return v.data === f.data && v.id !== f.id; });
    var faltasDia = mesmas.filter(function (v) { return v.falta; }), visitasDia = mesmas.filter(function (v) { return !v.falta; });

    var contDia = !f.id && !f.falta ? E.ajustes.filter(function (a) { return a.motivo === 'contagem' && a.data === f.data; }).pop() : null;
    var antesDaContagem = false;
    var etapas = Promise.resolve(true);
    var pergunta = function (t1, t2, b) { etapas = etapas.then(function (ok) { return ok && confirmar(t1, t2, b); }); };
    if (moverInicio) pergunta('Lançar antes do início do controle?', 'O controle começa em ' + dma(E.cfg.inicio) + '. Ao salvar, o início passa para ' + dma(f.data) + ' e o saldo inicial é zerado. Em seguida informe, em Ajustes, o que já estava com a lavanderia nessa data.', 'Salvar e mudar o início');
    if (checar.length) pergunta('Confira antes de salvar', checar.join(' ') + ' Está certo?', 'Está certo');
    if (!f.id && !f.falta && visitasDia.length) { var o = visitasDia[0]; pergunta('Já registraram este dia', cap(nome(o.por)) + ' já registrou uma visita em ' + dm(f.data) + ' (' + fkg(o.levou.cam) + ' kg levados, ' + fkg(o.trouxe.cam) + ' kg devolvidos). É outra visita no mesmo dia?', 'É outra visita'); }
    if (!f.id && f.falta && visitasDia.length) pergunta('Já há visita neste dia', 'Existe uma visita registrada em ' + dm(f.data) + '. Registrar a falta mesmo assim?', 'Registrar falta');
    if (!f.falta && faltasDia.length) pergunta('Este dia estava marcado como falta', 'Ao salvar a visita, a marcação de falta de ' + dm(f.data) + ' será apagada.', 'Salvar e apagar a falta');

    if (contDia && (f.lbr + f.lvm + f.tbr + f.tvm) > 0) etapas = etapas.then(function (ok) {
      if (!ok) return false;
      var hh = new Date(contDia.em); hh = isNaN(hh) ? '' : ' das ' + String(hh.getHours()).padStart(2, '0') + ':' + String(hh.getMinutes()).padStart(2, '0');
      return confirmar('Houve contagem de mops hoje', 'Esta visita aconteceu antes da contagem' + hh + '? Se sim, os mops dela já estão na contagem e não serão contados de novo.', 'Sim, foi antes').then(function (sim) { antesDaContagem = sim; return true; });
    });
    etapas.then(function (ok) {
      if (!ok) return;
      salvando = true;
      var btn = g('salvar'); btn.disabled = true; btn.textContent = 'Salvando…';
      var id = f.id || f.novoId;
      var ref = db.collection('visitas').doc(id);
      var gravacao, antesDe = Promise.resolve();
      if (moverInicio) antesDe = gravar(function () { return db.doc('config/geral').set(Object.assign({}, cru.cfg || {}, { inicio: f.data, saldoIni: { cam: 0, br: 0, vm: 0 }, editPor: meuId, editEm: agoraISO() })); });
      if (f.id) {
        // edição: confere se ninguém mudou ou apagou antes, e preserva campos desconhecidos
        gravacao = antesDe.then(function () { return Promise.race([ref.get(), new Promise(function (_, rej) { setTimeout(function () { rej({ code: 'timeout' }); }, 12000); })]).then(function (s) {
          if (!s.exists) throw { code: 'sumiu' };
          var atual = s.data();
          if ((atual.editEm || '') !== (f.original.editEm || '')) throw { code: 'mudou' };
          var final = Object.assign({}, atual, corpo, { por: atual.por || null, em: atual.em || '', editPor: meuId, editEm: agoraISO() });
          return gravar(function () { return ref.set(final); });
        }); });
      } else {
        corpo.por = meuId; corpo.em = antesDaContagem ? new Date(new Date(contDia.em).getTime() - 1000).toISOString() : agoraISO();
        gravacao = antesDe.then(function () { return gravar(function () { return ref.set(corpo); }); });
      }
      var copiasFaltas = faltasDia.map(function (x) { return { id: x.id, data: (cru.visitas.filter(function (c) { return c.id === x.id; })[0] || {}).data }; });
      gravacao.then(function () {
        if (!f.falta && faltasDia.length) faltasDia.forEach(function (x) { db.collection('visitas').doc(x.id).delete().catch(function () {}); });
        salvando = false; formNaTela = false;
        var editou = !!f.id;
        form = null;
        if (moverInicio) { toast('Salvo. Informe o que já estava com a lavanderia em ' + dma(f.data) + '.'); ir('ajustes'); }
        else if (editou) { toast('Alterações salvas'); ir('historico'); }
        else {
          toast(corpo.status === 'falta' ? 'Falta registrada' : 'Visita registrada', { rotulo: 'Desfazer', fn: function () {
            gravar(function () { return db.collection('visitas').doc(id).delete(); })
              .then(function () { return Promise.all(copiasFaltas.filter(function (c) { return c.data; }).map(function (c) { return gravar(function () { return db.collection('visitas').doc(c.id).set(c.data); }); })); })
              .then(function () { toast('Registro desfeito'); }, function (e) { toast(erroEscrita(e)); });
          } });
          ir('inicio');
        }
      }).catch(function (e) {
        salvando = false; btn.disabled = false; btn.textContent = f.id ? 'Salvar alterações' : 'Salvar visita';
        if (e && e.code === 'sumiu') msgForm('Outra pessoa excluiu este registro. Nada foi salvo.');
        else if (e && e.code === 'mudou') msgForm('Outra pessoa alterou este registro enquanto você editava. Volte ao histórico e abra de novo.');
        else msgForm(erroEscrita(e));
      });
    });
  }
  function excluirVisita() {
    var f = form;
    confirmar('Excluir o registro de ' + dma(f.data) + '?', 'Os saldos e o relatório deixam de contar esta visita.', 'Excluir', true).then(function (ok) {
      if (!ok) return;
      var copia = Object.assign({}, cru.visitas.filter(function (x) { return x.id === f.id; })[0] || {}).data;

  if (bSair) { if (window.lavEquipe) bSair.onclick = function () { window.lavEquipe.sair(); }; else bSair.hidden = true; }
  var casca = document.getElementById('casca'), rec = document.getElementById('recolher');
  function menu(recolhido) { casca.classList.toggle('recolhido', recolhido); rec.setAttribute('aria-expanded', String(!recolhido)); rec.setAttribute('aria-label', recolhido ? 'Abrir menu' : 'Recolher menu'); guardar('lav-menu', recolhido ? '1' : '0'); }
  menu(guardado('lav-menu', '0') === '1');
  rec.onclick = function () { menu(!casca.classList.contains('recolhido')); };
  window.addEventListener('beforeunload', function (e) { if (rota === 'registrar' && !formVazio(form) && !salvando) { e.preventDefault(); e.returnValue = ''; } });

  // ---------------- início ----------------
  rota = lerRota();
  if (rota === 'registrar') form = novoForm(hoje(), false);
  marcarAbas();
  var usar = function (n) { return window.claude && typeof window.claude.use === 'function' ? window.claude.use(n) : Promise.resolve(null); };
  usar('db').then(function (d) {
    db = d;
    if (!db) { semBanco = true; avisoRede = 'Não foi possível conectar ao banco de dados. Confira a internet e recarregue a página.'; marcarSinc('erro'); desenhar(); return; }
    return usar('user').then(function (u) {
      usr = u;
      if (!u) return;
      return Promise.all([u.id(), u.canEdit(), u.can('data.write')]).then(function (x) { meuId = x[0]; ehAdmin = !!x[1]; if (x[2] === false) podeEscrever = false; });
    }).then(function () { assinar(); desenhar(); });
  }).catch(function () { semBanco = true; avisoRede = 'Não foi possível conectar ao banco de dados.'; marcarSinc('erro'); desenhar(); });
  desenhar();
})();

/* nomes no menu recolhido */
document.querySelectorAll('.lateral-nav .aba, .lateral-nav .nav-btn').forEach(function (a) { if (!a.title) a.title = a.textContent.replace(/\s+/g, ' ').trim(); });

</script>
